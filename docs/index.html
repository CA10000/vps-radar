<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VPS 雷达 · 免费资源与热点</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f5f7; --card:#ffffff; --text:#1d1d1f; --sub:#6e6e73;
  --line:#d2d2d7; --blue:#0071e3; --blue-h:#0077ed;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.04);
  --shadow-h:0 4px 10px rgba(0,0,0,.08),0 12px 32px rgba(0,0,0,.08);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000; --card:#1c1c1e; --text:#f5f5f7; --sub:#98989d;
    --line:#38383a; --shadow:0 1px 3px rgba(0,0,0,.4);
    --shadow-h:0 4px 16px rgba(0,0,0,.6);
  }
}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro SC","SF Pro Text","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  font-feature-settings:"tnum";
  padding-bottom:env(safe-area-inset-bottom);
}

/* ── 顶栏 ── */
.top{
  position:sticky;top:0;z-index:100;
  background:rgba(245,245,247,.78);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--line);
}
@media (prefers-color-scheme:dark){
  .top{background:rgba(0,0,0,.72)}
}
.top-in{
  max-width:1180px;margin:0 auto;padding:0 16px;
  height:52px;display:flex;align-items:center;gap:14px;
}
.brand{font-size:17px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.brand em{font-style:normal;font-weight:400;color:var(--sub);font-size:13px;margin-left:6px}
.top-stats{display:flex;gap:16px;font-size:12.5px;color:var(--sub);margin-left:auto;flex-wrap:wrap}
.top-stats b{color:var(--text);font-weight:600}
.live{display:inline-block;width:6px;height:6px;border-radius:50%;background:#34c759;margin-right:5px;vertical-align:middle;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── 导航（分段控件）── */
.nav{
  max-width:1180px;margin:0 auto;padding:14px 16px 0;
}
.seg{
  display:flex;gap:2px;background:rgba(118,118,128,.12);
  padding:2px;border-radius:9px;overflow-x:auto;
  scrollbar-width:none;-ms-overflow-style:none;
}
.seg::-webkit-scrollbar{display:none}
.seg button{
  flex:0 0 auto;border:0;background:transparent;color:var(--text);
  font:inherit;font-size:13.5px;font-weight:500;
  padding:7px 16px;border-radius:7px;cursor:pointer;
  transition:background .18s,box-shadow .18s;white-space:nowrap;
}
.seg button[aria-selected="true"]{
  background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);
}
.seg .n{
  display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;
  border-radius:9px;background:rgba(118,118,128,.2);
  font-size:11px;font-weight:600;text-align:center;
}

/* ── 工具条 ── */
.tools{
  max-width:1180px;margin:0 auto;padding:12px 16px 0;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
}
.search{
  flex:1;min-width:160px;position:relative;
}
.search input{
  width:100%;border:.5px solid var(--line);background:var(--card);
  color:var(--text);font:inherit;font-size:14px;
  padding:9px 12px 9px 34px;border-radius:10px;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3.5px rgba(0,113,227,.14)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.42}
.chip{
  border:.5px solid var(--line);background:var(--card);color:var(--sub);
  font:inherit;font-size:13px;font-weight:500;
  padding:8px 14px;border-radius:99px;cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.chip:hover{color:var(--text)}
.chip[aria-pressed="true"]{
  background:var(--blue);border-color:var(--blue);color:#fff;
}

/* ── 主区 ── */
main{max-width:1180px;margin:0 auto;padding:14px 16px 48px}
.panel{display:none}
.panel.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── 卡片网格 ── */
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.card{
  background:var(--card);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow);
  transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s;
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:7px;
}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
.card:active{transform:scale(.994)}

/* 排名徽标 */
.rank{
  position:absolute;top:0;right:0;
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#9aa0a6,#6b7280);
  border-bottom-left-radius:12px;letter-spacing:-.02em;
}
.rank.g1{background:linear-gradient(135deg,#ffd60a,#ff9f0a);color:#3d2400}
.rank.g2{background:linear-gradient(135deg,#d7dce1,#a8b0b8);color:#2b3138}
.rank.g3{background:linear-gradient(135deg,#f0b27a,#c87f45);color:#3a2000}

.ct{display:flex;align-items:flex-start;gap:8px;padding-right:34px}
.cname{
  font-size:14.5px;font-weight:600;letter-spacing:-.01em;
  color:var(--text);text-decoration:none;word-break:break-all;line-height:1.35;
}
.cname:hover{color:var(--blue)}
.cdesc{
  font-size:13px;color:var(--sub);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.cfoot{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  margin-top:auto;padding-top:4px;font-size:12px;color:var(--sub);
}
.cfoot .k{display:flex;align-items:center;gap:4px}
.cfoot .v{color:var(--text);font-weight:600}
.grow{color:#ff6b00;font-weight:700}
@media (prefers-color-scheme:dark){.grow{color:#ff9f0a}}

/* 语言点 */
.lang{display:inline-flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;background:#8e8e93}

/* 标签 */
.tag{
  display:inline-block;padding:1px 8px;border-radius:6px;
  font-size:11px;font-weight:600;letter-spacing:.01em;
  background:rgba(0,113,227,.1);color:var(--blue);
}
.tag.ok{background:rgba(52,199,89,.14);color:#248a3d}
.tag.no{background:rgba(142,142,147,.14);color:var(--sub)}
@media (prefers-color-scheme:dark){
  .tag.ok{color:#30d158}
  .tag{background:rgba(10,132,255,.18);color:#0a84ff}
}

/* 结论块 */
.ai{
  border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.55;
  border-left:3px solid var(--line);background:rgba(118,118,128,.07);
}
.ai.ok{border-left-color:#34c759;background:rgba(52,199,89,.07)}
.ai b{font-weight:600;color:var(--text)}
.ai .risk{color:#ff9500;margin-top:3px;display:block}
.ai .hint{color:var(--sub);font-size:11.5px}

/* 空态 */
.empty{text-align:center;padding:64px 20px;color:var(--sub)}
.empty .t{font-size:16px;color:var(--text);font-weight:600;margin-bottom:6px}

/* 骨架 */
.skel{height:120px;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);animation:sh 1.4s ease-in-out infinite}
@keyframes sh{0%,100%{opacity:.6}50%{opacity:1}}

/* 历史时间线 */
.hist{display:flex;flex-direction:column;gap:10px}
.hrow{
  background:var(--card);border-radius:var(--radius);padding:14px 16px;
  box-shadow:var(--shadow);
}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.hdate{font-size:14px;font-weight:600}
.hcount{font-size:12px;color:var(--sub)}
.hlist{display:flex;flex-direction:column;gap:5px}
.hitem{
  display:flex;align-items:center;gap:9px;
  padding:5px 0;font-size:13px;border-top:.5px solid var(--line);
}
.hitem:first-child{border-top:0}
.hitem .repo{flex:1;color:var(--text);text-decoration:none;word-break:break-all}
.hitem .repo:hover{color:var(--blue)}
.hitem .g{color:#ff6b00;font-weight:600;font-size:12px;white-space:nowrap}

/* ── 推送记录 ── */
.pushlist{display:flex;flex-direction:column;gap:10px}
.pushcard{
  background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
  transition:box-shadow .18s;
}
.pushcard:hover{box-shadow:var(--shadow-h)}
.pushhead{
  display:flex;align-items:center;gap:10px;
  padding:13px 16px;cursor:pointer;user-select:none;
}
.pushkind{
  flex:0 0 auto;padding:2px 9px;border-radius:6px;
  font-size:11px;font-weight:600;letter-spacing:.01em;white-space:nowrap;
}
.k-免费资源{background:rgba(52,199,89,.14);color:#248a3d}
.k-GitHub热点{background:rgba(255,149,0,.14);color:#c93400}
.k-话题调研{background:rgba(0,113,227,.12);color:#0071e3}
.k-心跳{background:rgba(142,142,147,.16);color:var(--sub)}
@media (prefers-color-scheme:dark){
  .k-免费资源{color:#30d158}
  .k-GitHub热点{color:#ff9f0a}
  .k-话题调研{color:#0a84ff}
}
.pushmain{flex:1;min-width:0}
.pushtitle{
  font-size:14px;font-weight:600;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pushsub{
  font-size:12px;color:var(--sub);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pushmeta{
  flex:0 0 auto;font-size:11.5px;color:var(--sub);text-align:right;white-space:nowrap;
}
.pushfail{color:#ff3b30;font-size:11px;font-weight:600}
.chev{
  flex:0 0 auto;width:16px;height:16px;opacity:.35;
  transition:transform .2s;
}
.pushcard.open .chev{transform:rotate(180deg)}
.pushbody{
  display:none;padding:0 16px 15px;
  border-top:.5px solid var(--line);margin-top:0;
}
.pushcard.open .pushbody{display:block;animation:fade .2s}
.pushbody pre{
  font:13px/1.62 ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  white-space:pre-wrap;word-break:break-word;
  color:var(--text);margin-top:12px;
  max-height:520px;overflow:auto;
  padding:12px;border-radius:10px;background:rgba(118,118,128,.06);
}
.pitem{
  display:flex;gap:9px;padding:7px 0;font-size:13px;
  border-top:.5px solid var(--line);
}
.pitem:first-child{border-top:0;padding-top:0}
.pitem .num{flex:0 0 20px;color:var(--sub);font-size:12px;text-align:right}
.pitem .body{flex:1;min-width:0}
.pitem a{color:var(--text);text-decoration:none;font-weight:500;word-break:break-all}
.pitem a:hover{color:var(--blue)}
.pitem .d{color:var(--sub);font-size:12px;margin-top:1px}
.pitem .g{color:#ff6b00;font-weight:700;font-size:12px}
.pfilter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pfilter:last-of-type{margin-bottom:12px}
.pfilter .chip{padding:6px 12px;font-size:12.5px}
.pfilter .chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}

/* 返回顶部 */
.fab{
  position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));
  width:44px;height:44px;border-radius:50%;border:0;
  background:var(--card);box-shadow:0 4px 16px rgba(0,0,0,.16);
  color:var(--text);cursor:pointer;display:none;align-items:center;justify-content:center;
  z-index:90;transition:opacity .2s;
}
.fab.show{display:flex}
@media (prefers-color-scheme:dark){.fab{background:#2c2c2e}}

@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  .top-in{height:48px;padding:0 14px}
  .brand{font-size:16px}
  .brand em{display:none}
  .top-stats{gap:12px;font-size:11.5px}
  .nav,.tools,main{padding-left:14px;padding-right:14px}
  .card{padding:13px 14px}
}
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <div class="brand">VPS 雷达<em>免费资源 · 技术热点</em></div>
    <div class="top-stats" id="stats"></div>
  </div>
</div>

<div class="nav">
  <div class="seg" role="tablist" id="tabs"></div>
</div>

<div class="tools">
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></svg>
    <input type="search" id="q" placeholder="搜索项目、描述、语言" autocomplete="off">
  </div>
  <button class="chip" id="chipFree" aria-pressed="false">仅看免费</button>
</div>

<main id="main"></main>
<button class="fab" id="fab" aria-label="返回顶部">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => (n||0).toLocaleString('en-US');

const LANG_COLOR = {
  Python:'#3572A5', JavaScript:'#f1e05a', TypeScript:'#3178c6', Go:'#00ADD8',
  Rust:'#dea584', Java:'#b07219', 'C++':'#f34b7d', C:'#555555', Shell:'#89e051',
  HTML:'#e34c26', CSS:'#563d7c', Vue:'#41b883', Swift:'#F05138', Kotlin:'#A97BFF',
  Ruby:'#701516', PHP:'#4F5D95', CSharp:'#178600', Dart:'#00B4AB', Jupyter:'#DA5B0B'
};
const langColor = l => LANG_COLOR[l] || '#8e8e93';

let DATA = {items:[], trending:{snapshots:[],repos:{}}, pushLog:{records:[]}, jobs:{jobs:[]}};
let state = {tab:'hot', q:'', free:false};

/* ────────── 数据加载 ────────── */
async function load(){
  $('#main').innerHTML = '<div class="grid">'+'<div class="skel"></div>'.repeat(6)+'</div>';
  try{
    const [d, t, p, jb] = await Promise.all([
      fetch('data.json?t='+Date.now()).then(r=>r.json()).catch(()=>({items:[]})),
      fetch('trending.json?t='+Date.now()).then(r=>r.json()).catch(()=>({snapshots:[],repos:{}})),
      fetch('push_log.json?t='+Date.now()).then(r=>r.json()).catch(()=>({records:[]})),
      fetch('jobs.json?t='+Date.now()).then(r=>r.json()).catch(()=>({jobs:[]}))
    ]);
    DATA.items = d.items || [];
    DATA.trending = t || {snapshots:[],repos:{}};
    DATA.pushLog = p || {records:[]};
    DATA.jobs = jb || {jobs:[]};
  }catch(e){
    $('#main').innerHTML = '<div class="empty"><div class="t">数据加载失败</div><div>'+esc(e.message)+'</div></div>';
    return;
  }
  render();
}

/* ────────── 统计 ────────── */
function isFree(it){
  return it.ai && it.ai.is_free && it.ai.is_server && it.ai.confidence >= 65;
}
function renderStats(){
  const freeN = DATA.items.filter(isFree).length;
  const today = DATA.trending.snapshots?.[0];
  const hotN = today ? today.items.length : 0;
  const upd = DATA.trending.lastUpdate || '';
  const ago = upd ? timeAgo(new Date(upd)) : '';
  $('#stats').innerHTML =
    '<span><i class="live"></i>热点 <b>'+hotN+'</b></span>'
    + '<span>免费资源 <b>'+freeN+'</b></span>'
    + (ago?'<span>更新 <b>'+ago+'</b></span>':'');
}
function timeAgo(d){
  const s = (Date.now()-d.getTime())/1000;
  if(s<60) return '刚刚';
  if(s<3600) return Math.floor(s/60)+'分钟前';
  if(s<86400) return Math.floor(s/3600)+'小时前';
  return Math.floor(s/86400)+'天前';
}

/* ────────── 标签页 ────────── */
const TABS = [
  {k:'hot',    label:'GitHub 热点'},
  {k:'free',   label:'免费资源'},
  {k:'jobs',   label:'远程职位'},
  {k:'vps',    label:'低价 VPS'},
  {k:'ai',     label:'AI 工具'},
  {k:'push',   label:'推送记录'},
  {k:'history',label:'历史榜单'},
];

/* ── 远程职位 ── */
let jobStack = 'all';
let jobRegion = 'asia';

const JOB_STACKS = ['all','AI/ML','Python','TypeScript','JavaScript','Go','Rust','Java','DevOps','Cloud','Data','Frontend','Backend','Fullstack','Mobile','Security'];

function renderJobs(){
  const jobs = DATA.jobs?.jobs || [];
  if(!jobs.length){
    return '<div class="empty"><div class="t">暂无职位数据</div><div>下次抓取后出现</div></div>';
  }

  let list = jobs;
  // 地区筛选
  if(jobRegion==='asia'){
    list = list.filter(j => isAsiaFriendly(j.location));
  }
  // 技术栈筛选
  if(jobStack!=='all'){
    list = list.filter(j => (j.stacks||[]).includes(jobStack));
  }
  // 搜索
  if(state.q){
    const q = state.q.toLowerCase();
    list = list.filter(j =>
      ((j.title||'')+' '+(j.company||'')+' '+(j.desc||'')+' '+(j.location||'')).toLowerCase().includes(q));
  }

  // 筛选栏
  const regionBar = '<div class="pfilter">'
    + '<button class="chip" data-jr="asia" aria-pressed="'+(jobRegion==='asia')+'">中国可申请</button>'
    + '<button class="chip" data-jr="all" aria-pressed="'+(jobRegion==='all')+'">全部地区</button>'
    + '</div>';

  const stackBar = '<div class="pfilter">' + JOB_STACKS.map(s => {
    const n = s==='all' ? (DATA.jobs.jobs||[]).length : (DATA.jobs.jobs||[]).filter(j=>(j.stacks||[]).includes(s)).length;
    if(s!=='all' && n===0) return '';
    return '<button class="chip" data-js="'+esc(s)+'" aria-pressed="'+(jobStack===s)+'">'
      + (s==='all'?'全部技术':esc(s)) + ' <span style="opacity:.6">'+n+'</span></button>';
  }).join('') + '</div>';

  const countLine = '<div style="font-size:12.5px;color:var(--sub);margin:0 0 10px">共 '+list.length+' 个职位</div>';

  if(!list.length){
    return regionBar + stackBar + '<div class="empty"><div class="t">没有匹配的职位</div><div>换个筛选条件试试</div></div>';
  }

  const cards = list.map(j => {
    const stacks = (j.stacks||[]).slice(0,4).map(s => '<span class="tag">'+esc(s)+'</span>').join('');
    return '<article class="card">'
      + '<div class="ct"><a class="cname" href="'+esc(j.url)+'" target="_blank" rel="noopener">'+esc(j.title)+'</a></div>'
      + '<div class="cfoot" style="margin-top:2px">'
      +   '<span style="color:var(--text);font-weight:500">'+esc(j.company||'')+'</span>'
      +   '<span>'+esc(j.location||'')+'</span>'
      + '</div>'
      + (j.salary?'<div style="font-size:13px;font-weight:600;color:#30a14e">'+esc(j.salary)+'</div>':'')
      + (j.desc?'<div class="cdesc">'+esc(j.desc.slice(0,140))+'</div>':'')
      + '<div class="cfoot" style="gap:5px">'+stacks
      +   '<span style="margin-left:auto;font-size:11px">'+esc(j.source||'')+'</span>'
      + '</div>'
      + '</article>';
  }).join('');

  return regionBar + stackBar + countLine + '<div class="grid">'+cards+'</div>';
}

function isAsiaFriendly(loc){
  if(!loc) return true;
  let s = loc;
  if(s.includes('Ã')){ try{ s = s.encode; }catch(e){} }
  const bad = /\b(usa?|united states|us[- ]only|canada|uk|united kingdom|europe|emea|latam|latin america|brazil|india|germany|france|australia|africa|netherlands|spain|poland|portugal|italy|ireland|sweden|north america|south america|pst|est|cst|mst)\b/i;
  const good = /\b(worldwide|anywhere|global|asia|apac|singapore|hong\s*kong|japan|china|korea|taiwan)\b/i;
  const hasBad = bad.test(s);
  if(good.test(s) && !hasBad) return true;
  if(hasBad) return false;
  if(/\b(münchen|munich|berlin|london|paris|tokyo|seoul|arlington|toronto|vancouver|sydney|melbourne)\b/i.test(s)) return false;
  return true;
}

function bindJobEvents(){
  document.querySelectorAll('[data-jr]').forEach(b=>{
    b.onclick = ()=>{ jobRegion = b.dataset.jr; state.q = $('#q').value.trim(); render(); };
  });
  document.querySelectorAll('[data-js]').forEach(b=>{
    b.onclick = ()=>{ jobStack = b.dataset.js; state.q = $('#q').value.trim(); render(); };
  });
}

function renderTabs(){
  const freeN = DATA.items.filter(isFree).length;
  const today = DATA.trending.snapshots?.[0];
  const counts = {
    hot: today ? today.items.length : 0,
    free: freeN,
    vps: DATA.items.filter(i=>i.category==='A').length,
    ai: DATA.items.filter(i=>i.category==='C').length,
    jobs: (DATA.jobs?.jobs || []).length,
    push: (DATA.pushLog?.records || []).length,
    history: DATA.trending.snapshots?.length || 0,
  };
  $('#tabs').innerHTML = TABS.map(t =>
    '<button role="tab" data-k="'+t.k+'" aria-selected="'+(state.tab===t.k)+'">'
    + t.label + (counts[t.k]?'<span class="n">'+counts[t.k]+'</span>':'')
    + '</button>'
  ).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ state.tab = b.dataset.k; render(); window.scrollTo({top:0,behavior:'smooth'}); };
  });
}

/* ────────── 热点卡片 ────────── */
function trendItems(){
  const today = DATA.trending.snapshots?.[0];
  if(!today) return [];
  const repos = DATA.trending.repos || {};
  let list = today.items.map(x => {
    const r = repos[x.repo] || {};
    return {...r, repo:x.repo, growth:x.growth, stars:x.stars};
  });
  if(state.q){
    const q = state.q.toLowerCase();
    list = list.filter(i =>
      (i.repo||'').toLowerCase().includes(q) ||
      (i.desc||'').toLowerCase().includes(q) ||
      (i.lang||'').toLowerCase().includes(q));
  }
  return list;
}

function cardHot(it, idx){
  const cls = idx===0?'g1':idx===1?'g2':idx===2?'g3':'';
  const lc = langColor(it.lang);
  return '<article class="card">'
    + '<div class="rank '+cls+'">'+(idx+1)+'</div>'
    + '<div class="ct"><a class="cname" href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(it.repo)+'</a></div>'
    + (it.desc?'<div class="cdesc">'+esc(it.desc)+'</div>':'')
    + '<div class="cfoot">'
    +   '<span class="k grow">+'+num(it.growth)+'</span>'
    +   '<span class="k">总计 <span class="v">'+num(it.stars)+'</span></span>'
    +   (it.lang?'<span class="k lang"><i class="dot" style="background:'+lc+'"></i>'+esc(it.lang)+'</span>':'')
    + '</div></article>';
}

/* ────────── 资源卡片 ────────── */
function resItems(){
  let list = DATA.items;
  if(state.tab==='free') list = list.filter(isFree);
  else if(state.tab==='vps') list = list.filter(i=>i.category==='A');
  else if(state.tab==='ai') list = list.filter(i=>i.category==='C');
  if(state.free && state.tab!=='free') list = list.filter(isFree);
  if(state.q){
    const q = state.q.toLowerCase();
    list = list.filter(i => ((i.title||'')+' '+(i.summary||'')).toLowerCase().includes(q));
  }
  return list.slice(0, 200);
}

function cardRes(it){
  const a = it.ai;
  let verdict = '';
  if(a){
    const ok = a.is_free && a.is_server;
    const tag = a.tag ? '<span class="tag '+(ok?'ok':'no')+'">'+esc(a.tag)+'</span>' : '';
    const conf = '<span style="float:right;font-size:11px;opacity:.6">'+a.confidence+'%</span>';
    verdict = '<div class="ai '+(ok?'ok':'')+'">'
      + '<b>'+(ok?'免费可用':'已排除')+'</b> '+tag+conf
      + (a.real_free?'<div style="margin-top:2px">'+esc(a.real_free)+'</div>':'')
      + (a.risks && a.risks!=='无' ? '<span class="risk">'+esc(a.risks)+'</span>' : '')
      + '</div>';
  } else {
    verdict = '<div class="ai"><span class="hint">待审核</span></div>';
  }
  const badge = it.category==='A'?'低价VPS':it.category==='B'?'免费云':'技术';
  return '<article class="card">'
    + '<div class="ct"><a class="cname" href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(it.title)+'</a></div>'
    + (it.summary?'<div class="cdesc">'+esc(it.summary)+'</div>':'')
    + verdict
    + '<div class="cfoot"><span class="tag no">'+badge+'</span>'
    + '<span>'+esc(it.source_name||'')+'</span></div>'
    + '</article>';
}

/* ────────── 历史 ────────── */
function renderHistory(){
  const snaps = DATA.trending.snapshots || [];
  if(!snaps.length) return '<div class="empty"><div class="t">暂无历史</div><div>榜单会每天累积</div></div>';
  const repos = DATA.trending.repos || {};
  return '<div class="hist">' + snaps.map((s, si) => {
    const items = s.items.slice(0, 12);
    return '<div class="hrow">'
      + '<div class="hhead"><span class="hdate">'+esc(s.date)+(si===0?' <span class="tag ok">今日</span>':'')+'</span>'
      + '<span class="hcount">'+s.items.length+' 个热点</span></div>'
      + '<div class="hlist">' + items.map(x => {
          const r = repos[x.repo] || {};
          return '<div class="hitem">'
            + '<a class="repo" href="https://github.com/'+esc(x.repo)+'" target="_blank" rel="noopener">'+esc(x.repo)+'</a>'
            + '<span class="g">+'+num(x.growth)+'</span>'
            + '</div>';
        }).join('')
      + '</div></div>';
  }).join('') + '</div>';
}

/* ────────── 推送记录 ────────── */
let pushFilter = 'all';
let pushRange = 'all';   // all | today | week | month
let pushSort = 'new';    // new | old | count
let pushQuery = '';

const RANGES = [
  {k:'all',   label:'全部时间'},
  {k:'today', label:'今天'},
  {k:'week',  label:'近 7 天'},
  {k:'month', label:'近 30 天'},
];
const SORTS = [
  {k:'new',   label:'最新优先'},
  {k:'old',   label:'最早优先'},
  {k:'count', label:'条目最多'},
];

function inRange(isoAt, range){
  if(range==='all') return true;
  const t = new Date(isoAt).getTime();
  if(isNaN(t)) return true;
  const now = Date.now();
  const day = 86400000;
  if(range==='today'){
    const d = new Date(); d.setHours(0,0,0,0);
    return t >= d.getTime();
  }
  if(range==='week')  return now - t <= 7*day;
  if(range==='month') return now - t <= 30*day;
  return true;
}

function renderPush(){
  const recs = DATA.pushLog?.records || [];
  if(!recs.length){
    return '<div class="empty"><div class="t">还没有推送记录</div><div>下次自动推送后会出现在这里</div></div>';
  }

  // 类型统计（基于时间范围内的记录）
  const rangedRecs = recs.filter(r => inRange(r.at, pushRange));
  const kinds = ['all', ...new Set(recs.map(r=>r.kind))];

  // 应用筛选
  let filtered = rangedRecs;
  if(pushFilter !== 'all') filtered = filtered.filter(r => r.kind === pushFilter);
  if(pushQuery){
    const q = pushQuery.toLowerCase();
    filtered = filtered.filter(r =>
      (r.title||'').toLowerCase().includes(q) ||
      (r.summary||'').toLowerCase().includes(q) ||
      (r.content||'').toLowerCase().includes(q) ||
      (r.items||[]).some(it => ((it.title||it.name||'')+' '+(it.desc||'')+' '+(it.real_free||'')).toLowerCase().includes(q))
    );
  }

  // 排序
  filtered = [...filtered];
  if(pushSort === 'old') filtered.sort((a,b)=> new Date(a.at)-new Date(b.at));
  else if(pushSort === 'count') filtered.sort((a,b)=> (b.count||0)-(a.count||0));
  else filtered.sort((a,b)=> new Date(b.at)-new Date(a.at));

  // 类型栏
  const kindBar = '<div class="pfilter">' + kinds.map(k => {
    const n = k==='all' ? rangedRecs.length : rangedRecs.filter(r=>r.kind===k).length;
    return '<button class="chip" data-pk="'+esc(k)+'" aria-pressed="'+(pushFilter===k)+'">'
      + (k==='all'?'全部':esc(k)) + ' <span style="opacity:.6">'+n+'</span></button>';
  }).join('') + '</div>';

  // 时间栏
  const rangeBar = '<div class="pfilter">' + RANGES.map(r => {
    const n = r.k==='all' ? recs.length : recs.filter(x=>inRange(x.at, r.k)).length;
    return '<button class="chip" data-pr="'+r.k+'" aria-pressed="'+(pushRange===r.k)+'">'
      + r.label + ' <span style="opacity:.6">'+n+'</span></button>';
  }).join('') + '</div>';

  // 排序栏
  const sortBar = '<div class="pfilter">' + SORTS.map(s =>
    '<button class="chip" data-ps="'+s.k+'" aria-pressed="'+(pushSort===s.k)+'">'+s.label+'</button>'
  ).join('') + '</div>';

  const countLine = '<div style="font-size:12.5px;color:var(--sub);margin:0 0 10px">'
    + '共 ' + filtered.length + ' 条'
    + (filtered.length !== recs.length ? '（总 ' + recs.length + '）' : '')
    + '</div>';

  const filterBar = kindBar + rangeBar + sortBar + countLine;

  if(!filtered.length){
    return filterBar + '<div class="empty"><div class="t">没有匹配的记录</div><div>试试放宽筛选条件</div></div>';
  }

  const cards = filtered.map((r, i) => {
    const t = new Date(r.at);
    const when = t.toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const kindCls = 'k-' + (r.kind||'其他');
    let itemsHtml = '';
    if(r.items && r.items.length){
      itemsHtml = '<div style="margin-top:12px">' + r.items.slice(0,12).map((it, idx) => {
        const name = it.title || it.name || '';
        const url = it.url || '';
        const d = it.real_free || it.desc || '';
        const g = it.growth ? '<span class="g">+'+num(it.growth)+'</span>' : '';
        return '<div class="pitem">'
          + '<span class="num">'+(idx+1)+'</span>'
          + '<div class="body">'
          + (url?'<a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(name)+'</a>':'<span>'+esc(name)+'</span>')
          + (d?'<div class="d">'+esc(String(d).slice(0,110))+'</div>':'')
          + '</div>' + g + '</div>';
      }).join('') + '</div>';
    }
    return '<div class="pushcard" data-pi="'+i+'">'
      + '<div class="pushhead">'
      +   '<span class="pushkind '+kindCls+'">'+esc(r.kind||'未知')+'</span>'
      +   '<div class="pushmain">'
      +     '<div class="pushtitle">'+esc(r.title||'')+'</div>'
      +     (r.summary?'<div class="pushsub">'+esc(r.summary)+'</div>':'')
      +   '</div>'
      +   '<div class="pushmeta">'+when
      +     (r.success===false?'<div class="pushfail">推送失败</div>':'')
      +   '</div>'
      +   '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'
      + '</div>'
      + '<div class="pushbody">'
      +   itemsHtml
      +   (r.content?'<pre>'+esc(r.content)+'</pre>':'')
      + '</div>'
      + '</div>';
  }).join('');

  return filterBar + '<div class="pushlist">' + cards + '</div>';
}

/* ────────── 主渲染 ────────── */
function render(){
  renderStats();
  renderTabs();

  if(state.tab==='history'){
    $('#main').innerHTML = renderHistory();
    return;
  }
  if(state.tab==='push'){
    $('#main').innerHTML = renderPush();
    bindPushEvents();
    return;
  }
  if(state.tab==='jobs'){
    $('#main').innerHTML = renderJobs();
    bindJobEvents();
    return;
  }

  let html = '';
  if(state.tab==='hot'){
    const list = trendItems();
    html = list.length
      ? '<div class="grid">'+list.map(cardHot).join('')+'</div>'
      : '<div class="empty"><div class="t">暂无热点数据</div><div>等待下次抓取</div></div>';
  } else {
    const list = resItems();
    html = list.length
      ? '<div class="grid">'+list.map(cardRes).join('')+'</div>'
      : '<div class="empty"><div class="t">没有匹配结果</div><div>换个关键词试试</div></div>';
  }
  $('#main').innerHTML = html;
}

/* ────────── 推送记录交互 ────────── */
function bindPushEvents(){
  document.querySelectorAll('[data-pk]').forEach(b=>{
    b.onclick = ()=>{ pushFilter = b.dataset.pk; pushQuery = $('#q').value.trim(); render(); };
  });
  document.querySelectorAll('[data-pr]').forEach(b=>{
    b.onclick = ()=>{ pushRange = b.dataset.pr; pushQuery = $('#q').value.trim(); render(); };
  });
  document.querySelectorAll('[data-ps]').forEach(b=>{
    b.onclick = ()=>{ pushSort = b.dataset.ps; pushQuery = $('#q').value.trim(); render(); };
  });
  document.querySelectorAll('.pushhead').forEach(h=>{
    h.onclick = ()=> h.parentElement.classList.toggle('open');
  });
}

/* ────────── 交互 ────────── */
let timer = null;
$('#q').oninput = e => {
  clearTimeout(timer);
  timer = setTimeout(()=>{
    state.q = e.target.value.trim();
    pushQuery = state.q;
    render();
  }, 180);
};
$('#chipFree').onclick = () => {
  state.free = !state.free;
  $('#chipFree').setAttribute('aria-pressed', state.free);
  render();
};
window.addEventListener('scroll', ()=>{
  $('#fab').classList.toggle('show', window.scrollY > 600);
}, {passive:true});
$('#fab').onclick = ()=> window.scrollTo({top:0,behavior:'smooth'});

/* 启动 */
load();
setInterval(renderStats, 60000);
</script>
