name: VPS Radar Crawl (Manual)

# 定时抓取已迁移到 Altare 服务器
# Altare 每天 08:00 / 20:00（北京）抓取后自动 push 到本仓库
# 此工作流仅保留手动触发，用于应急

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Crawl and review
        working-directory: gh-action
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_MAX_PER_ROUND: "60"
        run: bun run src/run.js

      - name: Copy to docs for Pages
        run: |
          mkdir -p docs
          cp gh-action/docs/data.json docs/data.json

      - name: Commit
        run: |
          git config user.name "vps-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs gh-action/docs/data.json
          git diff --staged --quiet || git commit -m "manual crawl"
          git push
